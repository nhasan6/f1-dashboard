[theme]
base = "dark"  # default mode on first load
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap"
baseFontSize = 14
baseRadius = "14px"                 
linkUnderline = false
showWidgetBorder = true

# ---------------------------------------------------------------------------
# Dark  (primary) 
#   page background  #0A0E14
#   card / input     #161B22
#   hairline border  #2A313C
#   primary text     #E6E6E6
#   muted text       #8B949E
#   accent (teal)    #2DD4BF
# ---------------------------------------------------------------------------
[theme.dark]
backgroundColor = "#0A0E14"
secondaryBackgroundColor = "#1C232E"   
borderColor = "#39414D"                
textColor = "#E6E6E6"
primaryColor = "#2DD4BF"
linkColor = "#5EEAD4"
codeBackgroundColor = "#161B22"
codeTextColor = "#E6E6E6"
grayColor = "#8B949E"
chartCategoricalColors = ["#2DD4BF", "#F87171", "#FBBF24", "#818CF8", "#4ADE80", "#F472B6", "#38BDF8"]

[theme.dark.sidebar]
backgroundColor = "#0D1117"
secondaryBackgroundColor = "#1C232E"
borderColor = "#39414D"
textColor = "#E6E6E6"
primaryColor = "#2DD4BF"

# ---------------------------------------------------------------------------
# Light  (counterpart)  -- same roles, re-picked for a light surface.
#   primaryColor is a deeper teal so white button text stays legible.
# ---------------------------------------------------------------------------
[theme.light]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F6F8"
borderColor = "#D8DEE4"
textColor = "#1F2328"
primaryColor = "#0F766E"
linkColor = "#0F766E"
codeBackgroundColor = "#F4F6F8"
codeTextColor = "#1F2328"
grayColor = "#6B7280"
chartCategoricalColors = ["#0F766E", "#DC2626", "#D97706", "#4F46E5", "#16A34A", "#DB2777", "#0284C7"]

[theme.light.sidebar]
backgroundColor = "#F4F6F8"
secondaryBackgroundColor = "#EBEEF2"
borderColor = "#D8DEE4"
textColor = "#1F2328"
primaryColor = "#0F766E"
