name: refresh_data
on:
  schedule:
    - cron: "0 6 * 3-12 2" # every tuesday, march - december 
  
  workflow_dispatch: # lets you run workflow manually
    inputs:
      year:
        type: string
        required: false
      backfill:
        type: boolean
        default: false
        required: false

permissions: 
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh_data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 
        uses: actions/checkout@v4 
      - name: Setup Python
        uses: actions/setup-python@v5
        with: 
          python-version: "3.12"
          cache: pip
      - name: Cache FastF1 responses
        uses: actions/cache@v4
        with:
          path: .fastf1cache/
          key: fastf1-cache-${{ github.run_id }}
          restore-keys: |
            fastf1-cache-
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run script
        env:
          YEAR: ${{ inputs.year }}
          BACKFILL: ${{ inputs.backfill }}
        run: |
          if [ "$BACKFILL" = "true" ]; then
            python build_cache.py --backfill
          elif [ -n "$YEAR" ]; then
            python build_cache.py --year "$YEAR"
          else
            python build_cache.py
          fi
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore: refresh F1 data" 
          git pull --rebase origin main
          git push


